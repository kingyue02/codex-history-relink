name: build-windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependency
        run: python -m pip install pyinstaller
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: python -m PyInstaller --clean --onefile --name CodexHistoryRelink-Windows-x64 codex_history_relink.py
      - uses: actions/upload-artifact@v4
        with:
          name: CodexHistoryRelink-Windows-x64
          path: dist/CodexHistoryRelink-Windows-x64.exe
